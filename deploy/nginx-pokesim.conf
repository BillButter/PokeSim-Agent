# Nginx configuration for PokeSim Agent with optimal streaming support
# This configuration handles MJPEG streaming and live preview properly
#
# Place this in: /etc/nginx/sites-available/pokesim
# Then enable: sudo ln -s /etc/nginx/sites-available/pokesim /etc/nginx/sites-enabled/pokesim
# Test: sudo nginx -t
# Reload: sudo systemctl reload nginx

# Upstream backend definition
upstream pokesim_backend {
    server 127.0.0.1:8000 weight=1 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# HTTP to HTTPS redirect (optional)
server {
    listen 80;
    listen [::]:80;
    server_name pokesim.example.com;
    
    # For Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Redirect to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pokesim.example.com;
    
    # SSL configuration (use certbot/Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/pokesim.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pokesim.example.com/privkey.pem;
    
    # SSL best practices
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Compression settings (exclude streaming)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;
    gzip_disable "msie6";
    
    # Do NOT compress streaming responses
    gzip_types !multipart/x-mixed-replace;
    
    # Logging
    access_log /var/log/nginx/pokesim_access.log combined;
    error_log /var/log/nginx/pokesim_error.log warn;
    
    # Client upload size (for ROM imports)
    client_max_body_size 100M;
    
    # Main proxy location
    location / {
        proxy_pass http://pokesim_backend;
        
        # HTTP version and connection settings
        proxy_http_version 1.1;
        proxy_set_header Connection "keep-alive";
        proxy_set_header Upgrade $http_upgrade;
        
        # Forward client information
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
        
        # Critical for MJPEG streaming - disable buffering
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header X-Accel-Buffering no;
        
        # Timeouts for streaming
        proxy_connect_timeout 75s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
        
        # Buffer settings for non-streaming requests
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        
        # Cache bypass for dynamic content
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
    
    # Specific configuration for stream endpoint
    location ~ ^/[^/]+/stream$ {
        proxy_pass http://pokesim_backend;
        
        # Stream-specific settings
        proxy_http_version 1.1;
        proxy_set_header Connection "keep-alive";
        
        # Forward headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # CRITICAL: Disable all buffering for MJPEG
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header X-Accel-Buffering no;
        
        # MJPEG is continuous, needs longer timeouts
        proxy_read_timeout 120s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 90s;
        
        # No caching for streams
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
    
    # Health check endpoint
    location ~ ^/(health|healthz) {
        proxy_pass http://pokesim_backend;
        
        proxy_http_version 1.1;
        proxy_set_header Connection "keep-alive";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        access_log off;
    }
    
    # Static assets (can be cached)
    location /static/ {
        proxy_pass http://pokesim_backend;
        
        proxy_http_version 1.1;
        proxy_set_header Connection "keep-alive";
        proxy_set_header Host $host;
        
        # Cache static assets for 1 day
        proxy_cache_valid 200 1d;
        expires 1d;
        
        add_header Cache-Control "public, immutable";
    }
    
    # API endpoints (no cache)
    location /api/ {
        proxy_pass http://pokesim_backend;
        
        proxy_http_version 1.1;
        proxy_set_header Connection "keep-alive";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # API responses are dynamic
        proxy_buffering off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
}

# HTTP server (port 80) - for Let's Encrypt and redirects
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    
    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Everything else redirects to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}
