[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pokesim-agent"
version = "0.1.0"
description = "A local, OpenAI-compatible vision agent for Pokémon Game Boy emulation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PokeSim Agent contributors" }]
keywords = ["pokemon", "emulation", "pyboy", "agent", "vision", "llm", "fastapi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Games/Entertainment :: Emulators",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pillow>=10.0,<12",
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
emulator = ["pyboy>=2.0,<3"]
dev = [
  "pytest>=8.0,<9",
  "pytest-asyncio>=0.24,<1",
]

[project.scripts]
pokesim-agent = "app.__main__:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
filterwarnings = [
  "ignore::DeprecationWarning:websockets.*",
]
