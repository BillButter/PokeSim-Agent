# Pull-only deployment using the image published to GitHub Container Registry.
#
#   mkdir -p roms data
#   docker compose -f docker-compose.ghcr.yml up -d
#
# Copy this file (and optionally .env) to any machine with Docker. No source
# checkout or local build is required. The image targets linux/amd64.

services:
  pokesim-agent:
    image: ${POKESIM_IMAGE:-ghcr.io/billbutter/pokesim-agent:latest}
    container_name: pokesim-agent
    ports:
      # Loopback only by default. Set POKESIM_HOST_BIND=0.0.0.0 only if you
      # understand that the Adventure Library has no authentication.
      - "${POKESIM_HOST_BIND:-127.0.0.1}:${POKESIM_HOST_PORT:-8000}:8000"
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
      DATA_DIR: /data
      # Every .gb/.gbc/.zip in /roms is imported into the library at startup.
      ROM_DIR: /roms
      AI_BASE_URL: "${AI_BASE_URL:-}"
      AI_MODEL: "${AI_MODEL:-}"
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_POLL_INTERVAL: "${AI_POLL_INTERVAL:-4}"
      AI_MAX_CONTEXT_TURNS: "${AI_MAX_CONTEXT_TURNS:-8}"
      AI_IMAGE_HISTORY: "${AI_IMAGE_HISTORY:-2}"
      AI_MAX_ACTIONS: "${AI_MAX_ACTIONS:-8}"
      AI_MAX_FRAMES: "${AI_MAX_FRAMES:-120}"
      AI_TEMPERATURE: "${AI_TEMPERATURE:-0.2}"
      AI_TIMEOUT: "${AI_TIMEOUT:-120}"
      PUBLIC_URL: "${PUBLIC_URL:-http://127.0.0.1:${POKESIM_HOST_PORT:-8000}}"
    volumes:
      # Put .gb/.gbc files in ./roms (or set POKESIM_ROMS_PATH). Read-only.
      - "${POKESIM_ROMS_PATH:-./roms}:/roms:ro"
      # Settings, cartridge copies, generated game data and saves persist here.
      - "${POKESIM_DATA_PATH:-./data}:/data"
    extra_hosts:
      # Lets the container reach a model server running on the host.
      - "host.docker.internal:host-gateway"
    # The image runs as UID/GID 1000. If your host user differs, either chown
    # the data directory or set POKESIM_UID/POKESIM_GID and uncomment the line.
    # user: "${POKESIM_UID:-1000}:${POKESIM_GID:-1000}"
    restart: unless-stopped
